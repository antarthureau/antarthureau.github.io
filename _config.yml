# Site settings ------------------------------------------------------------
title: antart
description: >-
  Antoine Hureau-Parreira, engineer, sound artist and teacher in Bergen.
  Head engineer for music and performance at the University of Bergen.
lang: en
timezone: Europe/Oslo

# The repository must be named antarthureau.github.io for these settings.
# If the repo is named antarthureau.github.io, keep baseurl empty.
# If you use another repo name (e.g. "blog"), set baseurl: "/blog".
# If you point antart.no at GitHub Pages, set url: "https://antart.no".
url: "https://antarthureau.github.io"
baseurl: ""

author:
  name: Antoine Hureau-Parreira
  email: ahureau@pm.me
  # Shown in the sidebar, one line each
  roles:
    - Head engineer, music and performance, University of Bergen
    - Sound artist and consultant
  location: Bergen, Norway
  # Portrait in the sidebar and on the about page. It appears as soon as the
  # file exists; a square image of about 600 x 600 px works best.
  photo: /assets/img/portrait.jpg
  photo_credit: ""

github_username: antarthureau
repository: antarthureau/antarthureau.github.io

# Repositories to leave out of the automatic list on /code/
hide_repos:
  - antarthureau.github.io

# Build ------------------------------------------------------------------
permalink: /blog/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

# Project pages for selected works live in _works/ and are published at /works/<name>/
collections:
  works:
    output: true
    permalink: /works/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: works
    values:
      layout: work

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
