# Teaching at UiB.
# Semester codes: H = autumn (høst), V = spring (vår). 26H = autumn 2026.
#
# Each semester: move the "current" courses into "history" (or update their
# period) and add the new ones.

current:
  semester: autumn 2026
  courses:
    - code: MEME107
      title: Introduction to performance
      credits: 5 ECTS
      role: teacher and technical supervisor
      url: https://www4.uib.no/en/studies/courses/meme107
      summary: >-
        An undergraduate introduction to performance and time-based art
        at the Faculty of Fine Art, Music and Design.
    - code: PRO218
      title: Moods
      credits: 10 ECTS
      role: teacher and technical supervisor
      url: https://www4.uib.no/en/studies/courses/pro218
      summary: >-
        A project-based course on how mood, atmosphere and affect are made
        in contemporary art: the body as material, the choreography of
        space, and light, sound, video and performance combined into a
        single work. Taught through workshops and tasks, with individual
        and collaborative projects.

