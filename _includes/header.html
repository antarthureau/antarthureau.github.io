<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">antart</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if page.url == item.url %}
          {% assign current = true %}
        {% elsif item.url != "/" %}
          {% if page.url contains item.url %}{% assign current = true %}{% endif %}
        {% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
      </ul>
    </nav>
  </div>
</header>
